      <line x1="20" y1="210" x2="440" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>
      <line x1="20" y1="140" x2="440" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>
      <text x="24" y="302" fill="#64748b" font-family="monospace" font-size="11">Ene  Feb  Mar  Abr  May  Jun  Jul  Ago</text>
