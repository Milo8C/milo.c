      <text x="24" y="136" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Logística Transcontinental</text>
      <text x="24" y="154" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Contrato digital firmado ✓</text>

      <rect x="16" y="254" width="188" height="44" rx="6" fill="#6366f1"/>
      <text x="44" y="280" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Generar Nueva Oferta</text>
