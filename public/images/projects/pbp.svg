      <text x="20" y="110" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">✓ Dashboard para mentores con métricas de ingresos</text>
      
      <rect x="20" y="126" width="342" height="32" rx="6" fill="#10b981"/>
      <text x="120" y="146" fill="#022c22" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Confirmar y Reservar Sesión</text>
