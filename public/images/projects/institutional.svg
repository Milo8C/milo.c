<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09141d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg4)"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="960" height="56" fill="#0f172a"/>
  <circle cx="36" cy="28" r="6" fill="#ef4444"/><circle cx="56" cy="28" r="6" fill="#f59e0b"/><circle cx="76" cy="28" r="6" fill="#10b981"/>
  <text x="110" y="34" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">SISTEMA INTEGRAL DE GESTIÓN Y FISCALIZACIÓN INSTITUCIONAL</text>
  <rect x="800" y="14" width="130" height="28" rx="6" fill="#1e293b"/>
  <text x="815" y="32" fill="#38bdf8" font-family="monospace" font-size="11">Rol: Auditor Senior</text>

  <!-- Left: Approval Flow Pipeline -->
  <g transform="translate(40, 80)">
