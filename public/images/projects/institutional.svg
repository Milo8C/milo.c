      <g transform="translate(0, 140)">
        <text x="24" y="20" fill="#38bdf8" font-family="monospace" font-size="12">EXP-2026-0816</text>
        <text x="180" y="20" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12">Órgano de Control Interno</text>
        <text x="400" y="20" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">● Certificación Plena</text>
        <text x="580" y="20" fill="#cbd5e1" font-family="monospace" font-size="11">Hash: 3c90df... SHA-256</text>
        <rect x="730" y="4" width="70" height="24" rx="4" fill="#3b82f6"/>
        <text x="744" y="20" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11">Ver Cédula</text>
      </g>
