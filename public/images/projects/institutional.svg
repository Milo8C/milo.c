        <text x="16" y="24" fill="#64748b" font-family="monospace" font-size="10">ETAPA 4: RESOLUCIÓN</text>
        <text x="16" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Emisión de Cédula</text>
      </g>
    </g>

    <!-- Audit Records Table -->
    <g transform="translate(30, 140)">
      <rect width="820" height="240" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="820" height="38" rx="8" fill="#1e293b"/>
      <text x="24" y="24" fill="#94a3b8" font-family="monospace" font-size="11">FOLIO INTERNO</text>
      <text x="180" y="24" fill="#94a3b8" font-family="monospace" font-size="11">UNIDAD RESPONSABLE</text>
      <text x="400" y="24" fill="#94a3b8" font-family="monospace" font-size="11">ESTATUS RBAC</text>
      <text x="580" y="24" fill="#94a3b8" font-family="monospace" font-size="11">BITÁCORA AUDITORÍA</text>
      <text x="740" y="24" fill="#94a3b8" font-family="monospace" font-size="11">ACCIÓN</text>

