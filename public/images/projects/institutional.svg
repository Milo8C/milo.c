      <rect width="180" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="16" y="24" fill="#a7f3d0" font-family="monospace" font-size="10">ETAPA 1: RECEPCIÓN</text>
      <text x="16" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Ingreso de Solicitud ✓</text>

      <!-- Stage 2 -->
      <g transform="translate(200, 0)">
        <rect width="180" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
        <text x="16" y="24" fill="#a7f3d0" font-family="monospace" font-size="10">ETAPA 2: VALIDACIÓN</text>
        <text x="16" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Revisión Jurídica ✓</text>
      </g>

      <!-- Stage 3 Active -->
      <g transform="translate(400, 0)">
        <rect width="200" height="50" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="16" y="24" fill="#93c5fd" font-family="monospace" font-size="10">ETAPA 3: DICTAMEN TÉCNICO</text>
        <text x="16" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">En Fiscalización Activa</text>
      </g>

