        <text x="180" y="20" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12">Dirección General de Obras</text>
        <text x="400" y="20" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">● Aprobado por Comité</text>
        <text x="580" y="20" fill="#cbd5e1" font-family="monospace" font-size="11">Hash: 8f3a9e... SHA-256</text>
        <rect x="730" y="4" width="70" height="24" rx="4" fill="#3b82f6"/>
        <text x="744" y="20" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11">Ver Cédula</text>
      </g>
      <line x1="16" y1="84" x2="804" y2="84" stroke="#1e293b" stroke-width="1"/>

      <!-- Row 2 -->
      <g transform="translate(0, 94)">
        <text x="24" y="20" fill="#38bdf8" font-family="monospace" font-size="12">EXP-2026-0815</text>
        <text x="180" y="20" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12">Secretaría de Finanzas</text>
        <text x="400" y="20" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12">⏳ En Revisión Contable</text>
        <text x="580" y="20" fill="#cbd5e1" font-family="monospace" font-size="11">Hash: e194b7... SHA-256</text>
        <rect x="730" y="4" width="70" height="24" rx="4" fill="#1e293b"/>
        <text x="746" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Auditar</text>
      </g>
      <line x1="16" y1="130" x2="804" y2="130" stroke="#1e293b" stroke-width="1"/>

