<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg3)"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="960" height="56" fill="#0f172a"/>
  <line x1="0" y1="56" x2="960" y2="56" stroke="#1e293b" stroke-width="1"/>
  <circle cx="36" cy="28" r="6" fill="#ef4444"/><circle cx="56" cy="28" r="6" fill="#f59e0b"/><circle cx="76" cy="28" r="6" fill="#10b981"/>
  <text x="110" y="34" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">DOSSIER PRO · Sincronización Tolerante a Desconexión (Offline-First)</text>
  <rect x="740" y="14" width="190" height="28" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="754" y="32" fill="#fde68a" font-family="monospace" font-size="11">⚡ MODO OFFLINE: OPERATIVO</text>

  <!-- Left: Field Device / Tablet Interface -->
  <g transform="translate(40, 80)">
    <rect width="440" height="420" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="16" y="16" width="408" height="40" rx="6" fill="#1e293b"/>
    <text x="32" y="40" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Expediente de Inspección Técnica #2026-X8</text>
    
    <g transform="translate(16, 70)">
      <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">TITULAR / RAZÓN SOCIAL</text>
      <rect x="0" y="20" width="408" height="34" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="42" fill="#f8fafc" font-family="monospace" font-size="12">Terminal Marítima de Veracruz S.A. de C.V.</text>
    </g>

    <g transform="translate(16, 140)">
      <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">DICTAMEN PERICIAL &amp; AUDITORÍA</text>
      <rect x="0" y="20" width="408" height="80" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="42" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Inspección física realizada sin cobertura de red.</text>
      <text x="14" y="62" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Evidencia fotográfica y geolocalización cifradas en IndexedDB local.</text>
    </g>

    <g transform="translate(16, 250)">
      <rect width="408" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="28" cy="32" r="10" fill="#f59e0b"/>
      <text x="48" y="28" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Almacenado localmente en dispositivo (AES-256)</text>
      <text x="48" y="46" fill="#fde68a" font-family="monospace" font-size="11">4 Registros listos para auto-sync al detectar red</text>
    </g>

    <g transform="translate(16, 336)">
      <rect width="408" height="48" rx="8" fill="#059669"/>
      <text x="130" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">Guardar Expediente Offline</text>
    </g>
  </g>

  <!-- Right: Sync Architecture Diagram -->
  <g transform="translate(520, 80)">
    <rect width="400" height="420" rx="14" fill="#070c17" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="36" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Pipeline de Sincronización Automática</text>
    <text x="24" y="56" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Garantía de integridad de datos y resolución de conflictos</text>

    <!-- Node 1: Local Device -->
    <g transform="translate(24, 80)">
      <rect width="352" height="70" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="16" y="26" fill="#f59e0b" font-family="monospace" font-size="11">CLIENTE / PWA FIELD APP</text>
      <text x="16" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">IndexedDB Cache &amp; Service Workers</text>
      <circle cx="320" cy="35" r="12" fill="#10b981" fill-opacity="0.2"/>
      <text x="314" y="40" fill="#10b981" font-family="monospace" font-weight="bold">✓</text>
    </g>

    <!-- Arrow -->
    <path d="M200 154 L200 180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
    <polygon points="196,180 204,180 200,186" fill="#f59e0b"/>

    <!-- Node 2: Queue Broker -->
    <g transform="translate(24, 190)">
      <rect width="352" height="70" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="16" y="26" fill="#38bdf8" font-family="monospace" font-size="11">COLA ASÍNCRONA DE REINTENTOS</text>
      <text x="16" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Resolución de Conflictos Last-Write-Wins / Vector Clocks</text>
    </g>

    <!-- Arrow -->
    <path d="M200 264 L200 290" stroke="#10b981" stroke-width="2"/>
    <polygon points="196,290 204,290 200,296" fill="#10b981"/>

    <!-- Node 3: PostgreSQL Central Master -->
    <g transform="translate(24, 300)">
      <rect width="352" height="90" rx="8" fill="#061d19" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="26" fill="#34d399" font-family="monospace" font-size="11">SERVIDOR CENTRAL POSTGRESQL</text>
      <text x="16" y="50" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Base de Datos Maestra Replicada en Nube</text>
      <text x="16" y="72" fill="#a7f3d0" font-family="monospace" font-size="11">Cero pérdida de transacciones registradas</text>
    </g>
  </g>
</svg>