      <text x="46" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">En reproducción ahora</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(16, 218)">
      <rect width="272" height="64" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="24" cy="32" r="12" fill="#334155"/>
      <text x="21" y="36" fill="#94a3b8" font-family="monospace" font-size="11">03</text>
      <text x="46" y="26" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">03. Integración de Pasarelas</text>
      <text x="46" y="44" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Bloqueado · Próxima lección</text>
