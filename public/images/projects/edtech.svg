    <!-- Controls bar -->
    <rect x="0" y="290" width="560" height="50" rx="0" fill="#0f172a"/>
    <rect x="24" y="304" width="512" height="6" rx="3" fill="#334155"/>
    <rect x="24" y="304" width="340" height="6" rx="3" fill="url(#accentCyan)"/>
    <circle cx="364" cy="307" r="7" fill="#ffffff"/>
